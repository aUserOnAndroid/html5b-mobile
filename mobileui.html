<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFDIA 5b Mobile</title>
    <style>
        :root {
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-active: rgba(255, 255, 255, 0.4);
            --btn-text: #fff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* The UI Layer */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* Let touches pass to iframe if not hitting a button */
            z-index: 999; /* High number to stay on top */
        }

        button {
            position: absolute;
            pointer-events: auto; /* Buttons MUST have this to be clickable */
            background: var(--btn-bg);
            border: 2px solid rgba(255,255,255,0.3);
            color: var(--btn-text);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            font-family: Arial, sans-serif;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        button:active { background: var(--btn-active); transform: scale(1.1); }

        /* Controls Layout */
        .d-pad { width: 70px; height: 70px; font-size: 30px; }
        #left  { bottom: 90px; left: 20px; }
        #right { bottom: 90px; left: 160px; }
        #up    { bottom: 160px; left: 90px; }
        #down  { bottom: 20px; left: 90px; }

        #jump   { bottom: 50px; right: 30px; width: 100px; height: 100px; border-radius: 50px; font-weight: bold; }
        #switch { bottom: 170px; right: 40px; width: 70px; height: 70px; }
        #reset  { top: 20px; right: 20px; width: 60px; height: 40px; border-radius: 10px; font-size: 12px; }

    </style>
</head>
<body>

<div id="game-container">
    <!-- Ensure index.html exists in the same folder on GitHub -->
    <iframe src="index.html" id="game-frame"></iframe>

    <div id="ui-layer">
        <button id="left" class="d-pad">◀</button>
        <button id="right" class="d-pad">▶</button>
        <button id="up" class="d-pad">▲</button>
        <button id="down" class="d-pad">▼</button>

        <button id="jump">JUMP</button>
        <button id="switch">SWAP</button>
        <button id="reset">RESET</button>
    </div>
</div>

<script>
    const frame = document.getElementById('game-frame');
    
    // Key mapping for HTML5b
    const keys = {
        'left': 37, 'up': 38, 'right': 39, 'down': 40,
        'jump': 32, 'switch': 90, 'reset': 82
    };

    function triggerKey(code, type) {
        if (!frame.contentWindow) return;
        
        // Force focus so the game receives the event
        frame.contentWindow.focus();

        const event = new KeyboardEvent(type, {
            keyCode: code,
            which: code,
            code: getCode(code),
            bubbles: true,
            cancelable: true,
            view: frame.contentWindow
        });

        frame.contentWindow.document.dispatchEvent(event);
        frame.contentWindow.dispatchEvent(event);
    }

    function getCode(code) {
        return {37:'ArrowLeft', 38:'ArrowUp', 39:'ArrowRight', 40:'ArrowDown', 32:'Space', 90:'KeyZ', 82:'KeyR'}[code];
    }

    // Touch logic
    Object.keys(keys).forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerKey(keys[id], 'keydown');
            if (navigator.vibrate) navigator.vibrate(10);
        }, {passive: false});

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            triggerKey(keys[id], 'keyup');
        }, {passive: false});
    });

    // Handle initial focus
    window.addEventListener('load', () => {
        setTimeout(() => frame.contentWindow.focus(), 1000);
    });
</script>
</body>
</html>
