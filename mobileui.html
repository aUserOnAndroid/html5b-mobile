<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFDIA 5b Mobile Wrapper</title>
    <style>
        :root {
            --btn-bg: rgba(255, 255, 255, 0.2);
            --btn-active: rgba(255, 255, 255, 0.4);
            --btn-text: rgba(255, 255, 255, 0.8);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevents accidental zooming/scrolling */
        }

        /* Game takes full screen now */
        #game-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* HUD Overlay */
        #controls {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* Allows clicks to pass through to game if not on a button */
            z-index: 10;
        }

        button {
            position: absolute;
            pointer-events: auto; /* Re-enable for buttons */
            background: var(--btn-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--btn-text);
            border-radius: 50%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px); /* Modern frosted glass look */
            -webkit-backdrop-filter: blur(4px);
            user-select: none;
            -webkit-user-select: none;
        }

        button:active { background: var(--btn-active); transform: scale(0.95); }

        /* D-PAD Layout (Left Side) */
        .d-pad-btn { width: 60px; height: 60px; font-size: 24px; }
        #up    { bottom: 140px; left: 70px; }
        #down  { bottom: 20px;  left: 70px; }
        #left  { bottom: 80px;  left: 10px; }
        #right { bottom: 80px;  left: 130px; }

        /* Action Buttons (Right Side) */
        #jump   { bottom: 40px;  right: 20px; width: 90px; height: 90px; border-radius: 45px; font-size: 16px; }
        #switch { bottom: 140px; right: 30px; width: 60px; height: 60px; font-size: 14px; }
        #reset  { top: 10px;    right: 10px; width: 50px; height: 50px; border-radius: 10px; font-size: 12px; }
        
        /* Visibility Toggle */
        #hide-ui { top: 10px; left: 10px; width: 40px; height: 40px; font-size: 10px; border-radius: 5px; opacity: 0.5; }

    </style>
</head>
<body>

<div id="game-container">
    <iframe src="mobileui.html" id="game-frame"></iframe>
</div>

<div id="controls">
    <!-- Movement -->
    <button id="up" class="d-pad-btn">▲</button>
    <button id="down" class="d-pad-btn">▼</button>
    <button id="left" class="d-pad-btn">◀</button>
    <button id="right" class="d-pad-btn">▶</button>

    <!-- Actions -->
    <button id="jump">JUMP</button>
    <button id="switch">SWAP</button>
    <button id="reset">RESET</button>
    
    <button id="hide-ui">UI</button>
</div>

<script>
    const frame = document.getElementById('game-frame');
    const controls = document.getElementById('controls');
    
    const keys = {
        'up': 38, 'down': 40, 'left': 37, 'right': 39,
        'reset': 82, 'switch': 90, 'jump': 32
    };

    function sendKey(code, type) {
        const event = new KeyboardEvent(type, {
            keyCode: code,
            which: code,
            bubbles: true,
            cancelable: true
        });
        // We dispatch to the frame's window directly
        frame.contentWindow.dispatchEvent(event);
        frame.contentWindow.document.dispatchEvent(event);
    }

    // Handle UI Toggle
    document.getElementById('hide-ui').addEventListener('click', () => {
        const btns = document.querySelectorAll('button:not(#hide-ui)');
        btns.forEach(b => b.style.display = b.style.display === 'none' ? 'flex' : 'none');
    });

    // Attach touch events
    Object.keys(keys).forEach(id => {
        const btn = document.getElementById(id);
        
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            sendKey(keys[id], 'keydown');
            if (navigator.vibrate) navigator.vibrate(15);
        });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            sendKey(keys[id], 'keyup');
        });
    });
</script>
</body>
</html>
